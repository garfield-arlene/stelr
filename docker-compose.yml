version: "3.9"

# ─────────────────────────────────────────────
# Stelr v4.2.0 — docker compose
# Usage:
#   XML (default):    docker compose up
#   YAML:             docker compose --profile yaml up
#   HTML:             docker compose --profile html up
#   MySQL:            docker compose --profile mysql up
#   PostgreSQL:       docker compose --profile postgresql up
#
# Override admin credentials:
#   ADMIN_USERNAME=myuser ADMIN_PASSWORD=mypass docker compose up
#
# MySQL write durability vs. speed (default is fully durable):
#   MYSQL_FLUSH_LOG_AT_TRX_COMMIT=2 docker compose --profile mysql up
#   1 (default) - fsync on every commit; survives any crash, slowest writes
#   2           - fsync once/sec; survives MySQL crashes, up to ~1s lost on OS/power loss
#   0           - fsync once/sec; up to ~1s lost on MySQL crash too
# ─────────────────────────────────────────────

x-app-base: &app-base
  image: stelr:4.2.0
  restart: unless-stopped
  ports:
    - "8082:5000"
  networks:
    - stelr-net

x-app-env: &app-env
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  SECRET_KEY: ${SECRET_KEY:-stelr-secret-change-me}
  SESSION_TIMEOUT_MINUTES: ${SESSION_TIMEOUT_MINUTES:-30}

services:

  app-xml:
    <<: *app-base
    container_name: stelr-web-xml
    environment:
      <<: *app-env
      STORAGE_BACKEND: xml
      XML_FILE: /data/links.xml
    volumes:
      - stelrdata:/data
    profiles: ["", "xml"]

  app-yaml:
    <<: *app-base
    container_name: stelr-web-yaml
    environment:
      <<: *app-env
      STORAGE_BACKEND: yaml
      YAML_FILE: /data/links.yaml
    volumes:
      - stelrdata:/data
    profiles: ["yaml"]

  app-html:
    <<: *app-base
    container_name: stelr-web-html
    environment:
      <<: *app-env
      STORAGE_BACKEND: html
      HTML_FILE: /data/links.html
    volumes:
      - stelrdata:/data
    profiles: ["html"]

  app-mysql:
    <<: *app-base
    container_name: stelr-web-mysql
    environment:
      <<: *app-env
      STORAGE_BACKEND: mysql
      MYSQL_HOST: stelr-db-mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: stelr
      MYSQL_PASSWORD: stelr
      MYSQL_DATABASE: stelr
    depends_on:
      mysql:
        condition: service_healthy
    profiles: ["mysql"]

  mysql:
    image: mysql:8.3
    container_name: stelr-db-mysql
    restart: unless-stopped
    command: --innodb-flush-log-at-trx-commit=${MYSQL_FLUSH_LOG_AT_TRX_COMMIT:-1}
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stelr
      MYSQL_USER: stelr
      MYSQL_PASSWORD: stelr
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "stelr", "-pstelr"]
      interval: 5s
      timeout: 5s
      retries: 10
    profiles: ["mysql"]

  app-postgresql:
    <<: *app-base
    container_name: stelr-web-postgres
    environment:
      <<: *app-env
      STORAGE_BACKEND: postgresql
      POSTGRES_HOST: stelr-db-postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: stelr
      POSTGRES_USER: stelr
      POSTGRES_PASSWORD: stelr
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - stelr-net
    profiles: ["postgresql"]

  postgres:
    image: postgres:16-alpine
    container_name: stelr-db-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stelr
      POSTGRES_USER: stelr
      POSTGRES_PASSWORD: stelr
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stelr"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - stelr-net
    profiles: ["postgresql"]

volumes:
  stelrdata:
  mysql_data:
  pg_data:

networks:
  stelr-net:
    driver: bridge
