name: Build, Package, and Release Go App

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v1.0.0). Leave blank to read the repo''s VERSION file instead.'
        required: false
        default: ''
        type: string
      go_version:
        description: 'Go version to use. Leave blank to read it from stelr-desktop/go.mod instead.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish a public GitHub Release with these binaries (leave unchecked for a private test build you can download from the run summary). Every push to main always publishes, regardless of this setting.'
        required: true
        default: false
        type: boolean

jobs:
  resolve-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.value }}
      go_version: ${{ steps.resolve_go.outputs.value }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # An explicit input wins (e.g. cutting a version ahead of/independent
      # from VERSION); otherwise read the repo's own VERSION file -- the
      # same source container.yml's release-channel image tag uses, so the
      # desktop app and the container agree on what version this commit is.
      # A push to main never carries an input, so it always takes this
      # fallback. Unlike container.yml's bare image tag, GitHub Release tags
      # here have always used a "v" prefix (v5.0.2, v4.2.0, ...) -- add one
      # if VERSION doesn't already have it. Branch name is a last-resort
      # fallback if VERSION is ever missing.
      - name: Resolve version
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "value=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [ -s VERSION ]; then
            ver="$(cat VERSION)"
            case "$ver" in
              v*) echo "value=$ver" >> "$GITHUB_OUTPUT" ;;
              *) echo "value=v$ver" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "value=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      # Same idea for the Go toolchain version: an explicit input wins,
      # otherwise read it straight from go.mod's own "go" directive so a
      # push-triggered release can't drift out of sync with what the module
      # actually declares (the 1.22 -> 1.25 bump needed a manual workflow
      # edit precisely because this used to be a required, hardcoded input).
      - name: Resolve Go version
        id: resolve_go
        run: |
          if [ -n "${{ github.event.inputs.go_version }}" ]; then
            echo "value=${{ github.event.inputs.go_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=$(grep -m1 '^go ' stelr-desktop/go.mod | awk '{print $2}')" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (gofmt + go vet)
    needs: resolve-version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stelr-desktop
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.resolve-version.outputs.go_version }}
          cache: true
          cache-dependency-path: stelr-desktop/go.sum

      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Check gofmt formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  build:
    name: ${{ matrix.name }}
    needs: [lint, resolve-version]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: stelr-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon runners can natively target amd64 too, via
          # Xcode's universal clang -- no separate Intel runner needed.
          - name: macos-intel
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - name: macos-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
          # windows-arm64 is intentionally omitted: cgo needs a C toolchain
          # that targets aarch64-w64-mingw32, and stock MinGW-w64 gcc doesn't
          # support that target. The only option today is llvm-mingw; native
          # GNU toolchain support isn't expected until GCC 15. Revisit once
          # that lands, or the CI runner ships llvm-mingw preinstalled.

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # fyne package's --app-version wants a bare "x", "x.y", or "x.y.z"
      # semantic version -- strip a leading "v" if the resolved version
      # has one (e.g. "v1.0.0"); a branch name like "6.0" already fits.
      - name: Determine Fyne app-version
        id: app_version
        shell: bash
        run: echo "value=$(echo '${{ needs.resolve-version.outputs.version }}' | sed 's/^[vV]//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ needs.resolve-version.outputs.go_version }}
          cache: true
          cache-dependency-path: stelr-desktop/go.sum

      - name: Install Linux GUI build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # macOS (Tahoe+) dyld refuses to run Mach-O binaries missing an
      # LC_UUID load command, which Go's internal linker doesn't emit;
      # forcing external linking fixes it for both the fyne CLI tool below
      # and the app binary fyne package builds internally.
      - name: Install fyne packaging tool
        env:
          GOFLAGS: ${{ matrix.goos == 'darwin' && '-ldflags=-linkmode=external' || '' }}
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package app
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          GOFLAGS: ${{ matrix.goos == 'darwin' && '-ldflags=-linkmode=external' || '' }}
        run: fyne package -os ${{ matrix.goos }} -icon icon.png -name Stelr-Desktop -appID com.stelr.desktop -appVersion ${{ steps.app_version.outputs.value }}

      # fyne package's own output already has proper OS icon integration
      # (a real .app bundle on macOS, a .desktop-file-bearing tarball on
      # Linux). Only macOS needs an extra step: its output is a directory,
      # not a single file, so it has to be zipped to be a valid artifact/
      # release asset. Windows's output is already a single .exe, just
      # renamed. Linux's output is a .tar.xz; re-tar it as .tar.gz to match
      # the compression used everywhere else in this workflow.
      - name: Finalize macOS app bundle
        if: matrix.goos == 'darwin'
        run: zip -r -y "Stelr-desktop-${{ needs.resolve-version.outputs.version }}-${{ matrix.name }}.zip" Stelr-Desktop.app

      - name: Finalize Linux package
        if: matrix.goos == 'linux'
        run: |
          mkdir -p /tmp/stelr-linux-pkg
          tar -xJf Stelr-Desktop.tar.xz -C /tmp/stelr-linux-pkg

          # fyne package's generated Makefile never gets the icon into a
          # location GTK/GNOME actually resolves, regardless of install
          # target -- verified with a real GtkIconTheme.lookup_icon() call
          # against the as-shipped layout (returns None). The only layout
          # confirmed (same lookup call, actually resolves) is the
          # standard hicolor icon theme structure with the extension kept:
          # .../icons/hicolor/512x512/apps/com.stelr.desktop.png, matching
          # the icon's real 512x512 size. Rewrite both install targets'
          # destinations to that path, then append .png to every
          # remaining bare $(Icon) reference (source and destination
          # alike) in one pass.
          makefile=/tmp/stelr-linux-pkg/stelr-desktop/Makefile
          sed -i \
            -e 's#\$(DESTDIR)\$(PREFIX)/share/pixmaps/\$(Icon)#$(DESTDIR)$(PREFIX)/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            -e 's#\$(DESTDIR)\$(HOME)/\.local/share/pixmaps/\$(Icon)#$(DESTDIR)$(HOME)/.local/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            -e 's#\$(DESTDIR)\$(HOME)/\.local/share/icons/\$(Icon)#$(DESTDIR)$(HOME)/.local/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            "$makefile"
          sed -i 's#\$(Icon)#$(Icon).png#g' "$makefile"

          tar -czf "Stelr-desktop-${{ needs.resolve-version.outputs.version }}-${{ matrix.name }}.tar.gz" -C /tmp/stelr-linux-pkg .
          rm -rf Stelr-Desktop.tar.xz /tmp/stelr-linux-pkg

      - name: Finalize Windows executable
        if: matrix.goos == 'windows'
        run: mv Stelr-Desktop.exe "Stelr-desktop-${{ needs.resolve-version.outputs.version }}-${{ matrix.name }}.exe"

      # --- Upload as a private, non-published build artifact ---
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stelr-desktop-${{ matrix.name }}
          path: |
            stelr-desktop/*.tar.gz
            stelr-desktop/*.zip
            stelr-desktop/*.exe
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: [build, resolve-version]
    # workflow_dispatch respects the checkbox (default off, for private test
    # builds); a push to main always publishes -- that's the point of the
    # push trigger.
    if: ${{ inputs.publish_release || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stelr-desktop-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Archives
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ needs.resolve-version.outputs.version }}
          name: "Release ${{ needs.resolve-version.outputs.version }}"
          body: "Automated multi-platform production build of Go application."
          artifacts: "dist/*.tar.gz,dist/*.zip,dist/*.exe"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

