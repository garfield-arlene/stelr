name: Build, Package, and Release Go App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      go_version:
        description: 'Go version to use'
        required: true
        default: '1.22'
        type: string
      publish_release:
        description: 'Publish a public GitHub Release with these binaries (leave unchecked for a private test build you can download from the run summary)'
        required: true
        default: false
        type: boolean

jobs:
  lint:
    name: Lint (gofmt + go vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stelr-desktop
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go_version }}
          cache: true
          cache-dependency-path: stelr-desktop/go.sum

      - name: Install Linux GUI build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: Check gofmt formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

  build:
    name: ${{ matrix.name }}
    needs: lint
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: stelr-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon runners can natively target amd64 too, via
          # Xcode's universal clang -- no separate Intel runner needed.
          - name: macos-intel
            runner: macos-latest
            goos: darwin
            goarch: amd64
          - name: macos-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
          # windows-arm64 is intentionally omitted: cgo needs a C toolchain
          # that targets aarch64-w64-mingw32, and stock MinGW-w64 gcc doesn't
          # support that target. The only option today is llvm-mingw; native
          # GNU toolchain support isn't expected until GCC 15. Revisit once
          # that lands, or the CI runner ships llvm-mingw preinstalled.

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # fyne package's --app-version wants a bare "x", "x.y", or "x.y.z"
      # semantic version -- strip the "v" this workflow's own version
      # input otherwise carries (e.g. "v1.0.0", used as-is everywhere
      # else here: release tag, filenames).
      - name: Determine Fyne app-version
        id: app_version
        shell: bash
        run: echo "value=$(echo '${{ github.event.inputs.version }}' | sed 's/^[vV]//')" >> "$GITHUB_OUTPUT"

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go_version }}
          cache: true
          cache-dependency-path: stelr-desktop/go.sum

      - name: Install Linux GUI build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      # macOS (Tahoe+) dyld refuses to run Mach-O binaries missing an
      # LC_UUID load command, which Go's internal linker doesn't emit;
      # forcing external linking fixes it for both the fyne CLI tool below
      # and the app binary fyne package builds internally.
      - name: Install fyne packaging tool
        env:
          GOFLAGS: ${{ matrix.goos == 'darwin' && '-ldflags=-linkmode=external' || '' }}
        run: go install fyne.io/tools/cmd/fyne@latest

      - name: Package app
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          GOFLAGS: ${{ matrix.goos == 'darwin' && '-ldflags=-linkmode=external' || '' }}
        run: fyne package -os ${{ matrix.goos }} -icon icon.png -name Stelr-Desktop -appID com.stelr.desktop -appVersion ${{ steps.app_version.outputs.value }}

      # fyne package's own output already has proper OS icon integration
      # (a real .app bundle on macOS, a .desktop-file-bearing tarball on
      # Linux). Only macOS needs an extra step: its output is a directory,
      # not a single file, so it has to be zipped to be a valid artifact/
      # release asset. Windows's output is already a single .exe, just
      # renamed. Linux's output is a .tar.xz; re-tar it as .tar.gz to match
      # the compression used everywhere else in this workflow.
      - name: Finalize macOS app bundle
        if: matrix.goos == 'darwin'
        run: zip -r -y "Stelr-desktop-${{ github.event.inputs.version }}-${{ matrix.name }}.zip" Stelr-Desktop.app

      - name: Finalize Linux package
        if: matrix.goos == 'linux'
        run: |
          mkdir -p /tmp/stelr-linux-pkg
          tar -xJf Stelr-Desktop.tar.xz -C /tmp/stelr-linux-pkg

          # fyne package's generated Makefile never gets the icon into a
          # location GTK/GNOME actually resolves, regardless of install
          # target -- verified with a real GtkIconTheme.lookup_icon() call
          # against the as-shipped layout (returns None). The only layout
          # confirmed (same lookup call, actually resolves) is the
          # standard hicolor icon theme structure with the extension kept:
          # .../icons/hicolor/512x512/apps/com.stelr.desktop.png, matching
          # the icon's real 512x512 size. Rewrite both install targets'
          # destinations to that path, then append .png to every
          # remaining bare $(Icon) reference (source and destination
          # alike) in one pass.
          makefile=/tmp/stelr-linux-pkg/stelr-desktop/Makefile
          sed -i \
            -e 's#\$(DESTDIR)\$(PREFIX)/share/pixmaps/\$(Icon)#$(DESTDIR)$(PREFIX)/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            -e 's#\$(DESTDIR)\$(HOME)/\.local/share/pixmaps/\$(Icon)#$(DESTDIR)$(HOME)/.local/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            -e 's#\$(DESTDIR)\$(HOME)/\.local/share/icons/\$(Icon)#$(DESTDIR)$(HOME)/.local/share/icons/hicolor/512x512/apps/$(Icon)#g' \
            "$makefile"
          sed -i 's#\$(Icon)#$(Icon).png#g' "$makefile"

          tar -czf "Stelr-desktop-${{ github.event.inputs.version }}-${{ matrix.name }}.tar.gz" -C /tmp/stelr-linux-pkg .
          rm -rf Stelr-Desktop.tar.xz /tmp/stelr-linux-pkg

      - name: Finalize Windows executable
        if: matrix.goos == 'windows'
        run: mv Stelr-Desktop.exe "Stelr-desktop-${{ github.event.inputs.version }}-${{ matrix.name }}.exe"

      # --- Upload as a private, non-published build artifact ---
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stelr-desktop-${{ matrix.name }}
          path: |
            stelr-desktop/*.tar.gz
            stelr-desktop/*.zip
            stelr-desktop/*.exe
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stelr-desktop-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Archives
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: "Release ${{ github.event.inputs.version }}"
          body: "Automated multi-platform production build of Go application."
          artifacts: "dist/*.tar.gz,dist/*.zip,dist/*.exe"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

