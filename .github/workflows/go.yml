name: Build, Package, and Release Go App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'
        type: string
      go_version:
        description: 'Go version to use'
        required: true
        default: '1.22'
        type: string
      publish_release:
        description: 'Publish a public GitHub Release with these binaries (leave unchecked for a private test build you can download from the run summary)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: Build & Package (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
        working-directory: stelr-desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon runners can natively target amd64 too, via
          # Xcode's universal clang -- no separate Intel runner needed.
          - name: macos-intel
            runner: macos-latest
            goos: darwin
            goarch: amd64
            archive: tar.gz
          - name: macos-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            archive: tar.gz
          - name: linux-amd64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            archive: tar.gz
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            archive: tar.gz
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            archive: zip
          - name: windows-arm64
            runner: windows-11-arm
            goos: windows
            goarch: arm64
            archive: zip

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Go runtime
        uses: actions/setup-go@v5
        with:
          go-version: ${{ github.event.inputs.go_version }}
          cache: true

      - name: Install Linux GUI build dependencies
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          if [ "${{ matrix.goos }}" = "windows" ]; then
            go build -v -o Stelr-desktop.exe
          else
            go build -v -o Stelr-desktop
          fi

      - name: Package archive
        run: |
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip "Stelr-desktop-${{ github.event.inputs.version }}-${{ matrix.name }}.zip" Stelr-desktop.exe
            rm Stelr-desktop.exe
          else
            tar -czf "Stelr-desktop-${{ github.event.inputs.version }}-${{ matrix.name }}.tar.gz" Stelr-desktop
            rm Stelr-desktop
          fi

      # --- Upload as a private, non-published build artifact ---
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: stelr-desktop-${{ matrix.name }}
          path: |
            stelr-desktop/*.tar.gz
            stelr-desktop/*.zip
          retention-days: 14

  publish-release:
    name: Publish GitHub Release
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: stelr-desktop-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release and Upload Archives
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.event.inputs.version }}
          name: "Release ${{ github.event.inputs.version }}"
          body: "Automated multi-platform production build of Go application."
          artifacts: "dist/*.tar.gz,dist/*.zip"
          generateReleaseNotes: true
          token: ${{ secrets.GITHUB_TOKEN }}

