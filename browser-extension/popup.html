<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stelr</title>
<style>
  :root {
    --bg: #0d0f12; --surface: #161a1f; --border: #2a2f38;
    --accent: #00e5a0; --accent2: #0099ff; --danger: #ff3d5a;
    --text: #d4dbe8; --muted: #5a6478;
    --mono: 'Share Tech Mono', monospace, monospace; --sans: -apple-system, BlinkMacSystemFont, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans);
         width: 300px; margin: 0; padding: 1rem; }
  h1 { font-family: var(--mono); font-size: 0.85rem; color: var(--accent); letter-spacing: 1.5px;
       margin: 0 0 0.85rem; }
  label { display: block; font-size: 0.72rem; color: var(--muted); margin-bottom: 0.25rem; }
  input[type="text"], input[type="url"], input[type="number"], select {
    width: 100%; background: var(--surface); border: 1px solid var(--border); color: var(--text);
    font-family: var(--mono); font-size: 0.8rem; padding: 0.45rem 0.6rem; margin-bottom: 0.7rem;
  }
  .row { display: flex; gap: 0.5rem; }
  .row > div { flex: 1; }
  button { font-family: var(--mono); font-size: 0.72rem; text-transform: uppercase;
           letter-spacing: 1px; padding: 0.5rem 0.9rem; border: none; cursor: pointer; width: 100%; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted);
                    margin-top: 0.5rem; }
  .status { font-size: 0.75rem; margin-top: 0.6rem; }
  .status.error { color: var(--danger); }
  .status.success { color: var(--accent); }
  #logged-out-view { display: none; text-align: center; }
  #logged-out-view p { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.75rem; }
</style>
</head>
<body>
  <h1>// SAVE TO STELR</h1>

  <div id="logged-in-view">
    <label for="title-input">Title</label>
    <input type="text" id="title-input">
    <label for="url-input">URL</label>
    <input type="url" id="url-input">
    <div class="row">
      <div>
        <label for="rank-input">Rank</label>
        <input type="number" id="rank-input" value="0" min="0">
      </div>
      <div>
        <label for="group-select">Group</label>
        <select id="group-select"><option value="">No Group</option></select>
      </div>
    </div>
    <button class="btn-primary" id="save-btn">Save to Stelr</button>
    <div id="save-status" class="status"></div>
    <button class="btn-secondary" id="sync-now-btn">Sync Now</button>
    <div id="sync-status" class="status"></div>
  </div>

  <div id="logged-out-view">
    <p>Not connected to a Stelr server yet.</p>
    <button class="btn-primary" id="open-settings-btn">Open Settings</button>
  </div>

  <script src="lib/browser-polyfill.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
