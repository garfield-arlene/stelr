<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stelr — Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d0f12; --surface: #161a1f; --border: #2a2f38;
      --accent: #00e5a0; --accent2: #0099ff; --danger: #ff3d5a;
      --text: #d4dbe8; --muted: #5a6478;
      --mono: 'Share Tech Mono', monospace; --sans: 'Barlow', sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans);
           min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .card { background: var(--surface); border: 1px solid var(--border);
            padding: 2.5rem; width: 100%; max-width: 400px; }
    .logo { font-family: var(--mono); font-size: 1.8rem; color: var(--accent);
            letter-spacing: 4px; text-align: center; margin-bottom: 0.3rem; }
    .subtitle { font-family: var(--mono); font-size: 0.7rem; color: var(--muted);
                text-align: center; letter-spacing: 2px; margin-bottom: 2rem; }
    label { display: block; font-family: var(--mono); font-size: 0.7rem;
            color: var(--muted); text-transform: uppercase; letter-spacing: 1px;
            margin-bottom: 0.35rem; }
    input[type="text"], input[type="password"] {
      width: 100%; background: var(--bg); border: 1px solid var(--border);
      color: var(--text); font-family: var(--mono); font-size: 0.9rem;
      padding: 0.65rem 0.8rem; outline: none; margin-bottom: 1.2rem;
      transition: border-color 0.15s; }
    input:focus { border-color: var(--accent); }
    .btn { width: 100%; background: var(--accent); color: #000; border: none;
           font-family: var(--mono); font-size: 0.85rem; padding: 0.75rem;
           cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
           transition: opacity 0.15s; }
    .btn:hover { opacity: 0.85; }
    .footer-link { text-align: center; margin-top: 1.5rem; font-family: var(--mono);
                   font-size: 0.75rem; color: var(--muted); }
    .footer-link a { color: var(--accent2); text-decoration: none; }
    .flash-list { list-style: none; margin-bottom: 1.2rem; }
    .flash-list li { padding: 0.6rem 0.9rem; border-left: 3px solid;
                     font-size: 0.8rem; font-family: var(--mono); margin-bottom: 0.3rem; }
    .flash-list li.error   { border-color: var(--danger); color: var(--danger); }
    .flash-list li.success { border-color: var(--accent); color: var(--accent); }
    .flash-list li.info    { border-color: var(--accent2); color: var(--accent2); }
    .hint { font-family: var(--mono); font-size: 0.68rem; color: var(--muted);
            margin-top: -0.9rem; margin-bottom: 1.2rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">STELR</div>
  <div class="subtitle">// CREATE ACCOUNT</div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <ul class="flash-list">
        {% for cat, msg in messages %}<li class="{{ cat }}">{{ msg }}</li>{% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
  <form method="POST" action="/register">
    <label>Username</label>
    <input type="text" name="username" autocomplete="username" required>
    <label>Password</label>
    <input type="password" name="password" autocomplete="new-password" required>
    <div class="hint">Minimum 6 characters</div>
    <label>Confirm Password</label>
    <input type="password" name="confirm" autocomplete="new-password" required>
    <button type="submit" class="btn">Create Account</button>
  </form>
  <div class="footer-link">Already have an account? <a href="/login">Sign in</a></div>
</div>
</body>
</html>
